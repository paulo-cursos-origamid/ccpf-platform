services:
  postgres-test:
    image: postgres:16-alpine

    container_name: ccpf-postgres-test

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ccpf_test

    ports:
      - "5433:5432"

    volumes:
      - ccpf_postgres_test_data:/var/lib/postgresql/data

  api-test:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile

    container_name: ccpf-api-test

    environment:
      NODE_ENV: test

      DATABASE_URL: postgresql://postgres:postgres@postgres-test:5432/ccpf_test

    depends_on:
      - postgres-test

volumes:
  ccpf_postgres_test_data:
