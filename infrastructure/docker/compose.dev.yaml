services:
  postgres:
    image: postgres:16-alpine
    container_name: ccpf-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ccpf

    ports:
      - "5432:5432"

    volumes:
      - ccpf-postgres-data:/var/lib/postgresql/data

    networks:
      - ccpf-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ccpf"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    container_name: ccpf-api
    user: "1000:1000"
    build:
      context: ../../apps/api
      dockerfile: Dockerfile

    ports:
      - "3001:3000"

    env_file:
      - ../../apps/api/.env.docker
    volumes:
      - ../../apps/api:/app
      - /app/node_modules

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - ccpf-network

  web:
    container_name: ccpf-web
    restart: unless-stopped

    build:
      context: ../../apps/web
      dockerfile: Dockerfile

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: development

      NEXT_PUBLIC_API_URL: http://localhost:3001

    volumes:
      - ../../apps/web:/app
      - /app/node_modules

    depends_on:
      - api

    networks:
      - ccpf-network

volumes:
  ccpf-postgres-data:

networks:
  ccpf-network:
    name: ccpf-network
    driver: bridge
