services:
  postgres:
    image: postgres:16-alpine
    container_name: ccpf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ccpf
    ports:
      - "5432:5432"
    volumes:
      - ccpf_postgres_data:/var/lib/postgresql/data

volumes:
  ccpf_postgres_data:
